<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abhaya News Admin</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <header>
        <div class="container">
            <div class="logo">
                <h1>ABHAYA NEWS ADMIN</h1>
            </div>
            <nav>
                <ul>
                    <li><a href="index.html">Back to Website</a></li>
                </ul>
            </nav>
            <div class="auth-buttons">
                <button id="logoutBtn">Logout</button>
            </div>
        </div>
    </header>

    <main>
        <div class="container">
            <div class="admin-panel">
                <h2>Upload News</h2>
                <form id="uploadForm">
                    <div class="form-group">
                        <label for="title">Title</label>
                        <input type="text" id="title" required>
                    </div>
                    <div class="form-group">
                        <label for="category">Category</label>
                        <select id="category" required>
                            <option value="general">General</option>
                            <option value="politics">Politics</option>
                            <option value="technology">Technology</option>
                            <option value="sports">Sports</option>
                            <option value="entertainment">Entertainment</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="image">Image</label>
                        <input type="file" id="image" accept="image/*">
                    </div>
                    <div class="form-group">
                        <label for="body">Content</label>
                        <textarea id="body" rows="10" required></textarea>
                    </div>
                    <button type="submit">Upload News</button>
                </form>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2025 Abhaya News. All rights reserved.</p>
        </div>
    </footer>

    <script src="admin.js"></script>
</body>
</html>
