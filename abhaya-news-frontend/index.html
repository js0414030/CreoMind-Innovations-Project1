<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abhaya News</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="slider.css">
</head>
<body>
    <header id="navbar">
        <!-- Navbar will be loaded here by JavaScript -->
    </header>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <main>
        <!-- Banner Slider Section -->
        <section class="banner-slider">
            <div class="slider-container">
                <div class="slider">
                    <!-- Slider content will be loaded dynamically -->
                    <div class="loading">Loading latest news...</div>
                </div>
                <button class="slider-btn prev-btn"><i class="fas fa-chevron-left"></i></button>
                <button class="slider-btn next-btn"><i class="fas fa-chevron-right"></i></button>
                <div class="slider-dots">
                    <!-- Dots will be generated dynamically -->
                </div>
            </div>
        </section>

        <div class="container">
            <!-- Trending Section -->
            <section class="trending-section">
                <h2 class="section-title"><i class="fas fa-fire"></i> Trending Now</h2>
                <div class="trending-grid">
                    <!-- Trending content will be loaded dynamically -->
                    <div class="loading">Loading trending news...</div>
                </div>
            </section>

            <!-- Latest News Section -->
            <section class="latest-news-section">
                <h2 class="section-title"><i class="fas fa-newspaper"></i> Latest News</h2>
                <div class="news-grid">
                    <!-- News articles will be loaded here -->
                    <div class="loading">Loading news...</div>
                </div>

                <div class="pagination">
                    <button id="prevPage" disabled>Previous</button>
                    <span id="currentPage">Page 1</span>
                    <button id="nextPage">Next</button>
                </div>
            </section>

            <!-- Category Highlights -->
            <section class="category-highlights">
                <!-- Category highlights will be loaded dynamically -->
                <div class="loading">Loading category highlights...</div>
            </section>
        </div>
    </main>

    <!-- Enhanced Login Modal -->
    <div id="loginModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2><i class="fas fa-user-shield"></i> Admin Login</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label for="email"><i class="fas fa-envelope"></i> Email Address</label>
                    <input type="email" id="email" placeholder="Enter your email address" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="password"><i class="fas fa-lock"></i> Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password">
                </div>
                <button type="submit">
                    <i class="fas fa-sign-in-alt"></i> Sign In
                </button>
                <div class="login-footer">
                    <p><i class="fas fa-shield-alt"></i> Secure admin access only</p>
                </div>
            </form>
        </div>
    </div>

    <!-- News Detail Modal -->
    <div id="newsDetailModal" class="modal">
        <div class="modal-content news-detail">
            <span class="close">&times;</span>
            <div id="newsDetailContent">
                <!-- News detail will be loaded here -->
            </div>
        </div>
    </div>

    <!-- Newsletter Subscription -->
    <section class="newsletter">
        <div class="container">
            <div class="newsletter-content">
                <h2>Subscribe to Our Newsletter</h2>
                <p>Stay updated with the latest news and exclusive content delivered to your inbox.</p>
                <form class="newsletter-form">
                    <input type="email" placeholder="Enter your email address" required>
                    <button type="submit">Subscribe</button>
                </form>
            </div>
        </div>
    </section>

    <footer id="footer">
        <!-- Footer will be loaded here by JavaScript -->
    </footer>



    <script src="toast.js"></script>
    <script src="components.js"></script>
    <script src="slider.js"></script>
    <script src="app.js"></script>
    <script src="category.js"></script>
    <script>
        // Make category cards in the home page clickable and navigate to category pages
        document.addEventListener('DOMContentLoaded', function() {
            const categoryCards = document.querySelectorAll('.category-card');
            categoryCards.forEach(card => {
                card.addEventListener('click', () => {
                    // Find which category section this card belongs to
                    const categorySection = card.closest('.category-row');
                    const categoryHeader = categorySection.querySelector('.category-header');
                    const viewAllLink = categoryHeader.querySelector('.view-all');

                    // Navigate to the category page
                    if (viewAllLink && viewAllLink.href) {
                        window.location.href = viewAllLink.href;
                    }
                });
            });
        });
    </script>
</body>
</html>
