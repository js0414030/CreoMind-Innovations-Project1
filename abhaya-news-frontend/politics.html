<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abhaya News - Politics</title>
    <meta name="description" content="Stay updated with the latest political news, government policies, and international relations.">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="slider.css">
</head>
<body>
    <header id="navbar">
        <!-- Navbar will be loaded here by JavaScript -->
    </header>

    <main>
        <!-- Politics Banner -->
        <section class="banner-slider">
            <div class="slider-container">
                <div class="slider">
                    <!-- Slider content will be loaded dynamically -->
                    <div class="loading">Loading latest politics news...</div>
                </div>
                <button class="slider-btn prev-btn"><i class="fas fa-chevron-left"></i></button>
                <button class="slider-btn next-btn"><i class="fas fa-chevron-right"></i></button>
                <div class="slider-dots">
                    <!-- Dots will be generated dynamically -->
                </div>
            </div>
        </section>

        <div class="container">
            <!-- Trending Politics News -->
            <section class="trending-section">
                <h2 class="section-title"><i class="fas fa-fire"></i> Trending in Politics</h2>
                <div class="trending-grid">
                    <!-- Trending content will be loaded dynamically -->
                    <div class="loading">Loading trending politics news...</div>
                </div>
            </section>

            <!-- Latest Politics News -->
            <section class="latest-news-section">
                <h2 class="section-title"><i class="fas fa-newspaper"></i> Latest Politics News</h2>
                <div class="news-grid">
                    <!-- News articles will be loaded here by JavaScript -->
                    <div class="loading">Loading politics news...</div>
                </div>

                <div class="pagination">
                    <button id="prevPage" disabled>Previous</button>
                    <span id="currentPage">Page 1</span>
                    <button id="nextPage">Next</button>
                </div>
            </section>
        </div>
    </main>

    <!-- Newsletter Subscription -->
    <section class="newsletter">
        <div class="container">
            <div class="newsletter-content">
                <h2>Subscribe to Our Politics Newsletter</h2>
                <p>Stay updated with the latest political news and analysis delivered to your inbox.</p>
                <form class="newsletter-form">
                    <input type="email" placeholder="Enter your email address" required>
                    <button type="submit">Subscribe</button>
                </form>
            </div>
        </div>
    </section>

    <footer id="footer">
        <!-- Footer will be loaded here by JavaScript -->
    </footer>

    <!-- Login Modal -->
    <div id="loginModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Admin Login</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit">Login</button>
            </form>
        </div>
    </div>

    <!-- News Detail Modal -->
    <div id="newsDetailModal" class="modal">
        <div class="modal-content news-detail">
            <span class="close">&times;</span>
            <div id="newsDetailContent">
                <!-- News detail content will be loaded here -->
            </div>
        </div>
    </div>

    <script src="toast.js"></script>
    <script src="components.js"></script>
    <script src="slider.js"></script>
    <script src="category.js"></script>
</body>
</html>
